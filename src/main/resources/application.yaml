server:
  port: 8882

spring:
  application:
    name: Practice
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/mydb?characterEncoding=UTF-8
    username: mydbid
    password: mydbpw
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    thymeleaf:
      prefix: classpath:/templates/
      suffix: .html
      cache: false
      check-template-location: true

    sql:
      init:
        mode: always
        schema-locations: classpath:db/sprint2_schema.sql
        encoding: UTF-8
        continue-on-error: false
