<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 메인 페이지</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>
    <div class="hq-layout d-flex">
        <!-- 사이드바가 동적으로 주입 될 컨테이너 -->
        <div id="sidebar-container"></div>

        <main class="hq-main">
            <!-- 헤더가 동적으로 주입 될 컨테이너 -->
            <div id="header-container"></div>

            <div class="hq-content p-4">
                <!-- 개발 중 전체 화면으로 이동 할 수 있는 바로가기. 기존 UI는 그대로 유지 -->
                <details class="card hq-card p-3 mb-3">
                    <summary class="fw-bold">개발용 전체 메뉴 바로 가기</summary>
                    <div class="d-flex gap-2 flex-wrap mt-3">
                        <a class="btn btn-outline-primary btn-sm" href="/orders/list">본사 발주 조회</a>
                        <a class="btn btn-outline-primary btn-sm" href="/store/orders/request">직영점 발주 요청</a>
                        <a class="btn btn-outline-primary btn-sm" href="/store/orders/list">직영점 발주 조회</a>
                        <a class="btn btn-outline-primary btn-sm" href="/inventory/list">재고 조회</a>
                        <a class="btn btn-outline-primary btn-sm" href="/ingredients/list">식재료 조회</a>
                        <a class="btn btn-outline-primary btn-sm" href="/ingredients/request">식재료 등록</a>
                        <a class="btn btn-outline-primary btn-sm" href="/hq/disposal/list">본사 폐기 조회</a>
                        <a class="btn btn-outline-primary btn-sm" href="/hq/disposal/request">본사 폐기 등록</a>
                        <a class="btn btn-outline-primary btn-sm" href="/store/disposal/list">직영점 폐기 조회</a>
                        <a class="btn btn-outline-primary btn-sm" href="/store/disposal/request">직영점 폐기 등록</a>
                    </div>
                </details>

                <section class="row g-3 mb-3">
                    <div class="col-6 col-xl-3">
                        <div class="card hq-card p-3 h-100">
                            <div class="text-secondary small">전체 재고 현황</div>
                            <div class="hq-kpi-number">4.8%</div>
                            <small class="text-primary">▼ 0.3%</small>
                        </div>
                    </div>

                    <div class="col-6 col-xl-3">
                        <div class="card hq-card p-3 h-100">
                            <div class="text-secondary small">재고 부족 품목</div>
                            <div class="hq-kpi-number">3개</div>
                            <small class="text-warning">▼ 1개</small>
                        </div>
                    </div>

                    <div class="col-6 col-xl-3">
                        <div class="card hq-card p-3 h-100">
                            <div class="text-secondary small">예상 폐기 금액 (7일)</div>
                            <div class="hq-kpi-number">78만원</div>
                            <small class="text-danger">▲ 12%</small>
                        </div>
                    </div>

                    <div class="col-6 col-xl-3">
                        <div class="card hq-card p-3 h-100">
                            <div class="text-secondary small">가맹점 매출 (전체)</div>
                            <div class="hq-kpi-number">2.38억원</div>
                            <small class="text-success">▲ 5.1%</small>
                        </div>
                    </div>
                </section>


            </div>
        </main>
    </div>
    <script src="/js/api.js"></script>
    <!-- Bootstrap 모달 및 Offcanvas 기능 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/drawer.js"></script>
    <script src="/js/pageDemo.js"></script>
</body>
</html>
